<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { display: grid; grid-template-columns: 1fr 440px; }
  main {
    background: var(--bg-card);
    border-right: 1px solid var(--rule-strong);
    padding: 54px 52px;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 66px; margin-top: 20px; }
  .cuerpo { margin-top: auto; }
  .pie { margin-top: auto; padding-top: 24px; border-top: 1px solid var(--rule); }
  .pie .temas { font-size: 15px; font-weight: 600; color: var(--accent); }
  figure { position: relative; }
  figure img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  figcaption {
    position: absolute; inset-inline: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.92);
    color: #FFFFFF;
    padding: 20px 28px;
  }
  figcaption .nombre { font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; line-height: 1.1; }
  figcaption .credencial { margin-top: 7px; font-size: 12px; color: var(--rule-strong); }
</style></head>
<body>
  <main>
    <div class="wordmark">NeuroVOD<span>Médica</span></div>
    <div class="cuerpo">
      <p class="kicker">Compendio clínico · 2026</p>
      <h1>Lo que explico en consulta, ordenado.</h1>
    </div>
    <div class="pie">
      <div class="temas">TDAH · TEA · Sensorial · Neurodesarrollo</div>
    </div>
  </main>
  <figure>
    <img src="../imagenes/fuente/foto_dr.jpeg" alt="">
    <figcaption>
      <div class="nombre">Dr. José Nogueira</div>
      <div class="credencial">Médico pediatra · MN 65891</div>
    </figcaption>
  </figure>
</body></html>
